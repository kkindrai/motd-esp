<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KJK Notion Quote Generator</title>

    <script src="/js/main.js"></script>
    <script src="/js/csv_parsing.js"></script>

    <!-- Styling -->
    <style>
        body {
            background: #191919;
        }
        
        blockquote {
            background: #f9f9f942;
            border-left: 10px solid #5555FF;
            margin: 1.5em 10px;
            padding: 0.5em 10px;
            quotes: "\201C""\201D""\2018""\2019";
            color: white;
        }
        
        blockquote:before {
            color: white;
            content: open-quote;
            font-size: 4em;
            line-height: 0.1em;
            margin-right: 0.25em;
            vertical-align: -0.4em;
        }
        
        blockquote p {
            display: inline;
        }
    </style>
</head>
<body>

    <div id="content" />

</body>

    buildDOM();
</script>
